services:
  baixador:
    image: ghcr.io/michaelrodriguesoficial/baixador:latest
    # para gerar a imagem a partir do código desta pasta, troque a linha acima por:
    # build: .
    container_name: baixador
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_USER: admin
      APP_PASSWORD: troque-esta-senha     # senha do painel (obrigatória)
      LINK_TTL_HOURS: "24"                # validade do link gerado, em horas
      PUBLIC_URL: ""                      # opcional, ex.: https://baixar.seudominio.com.br
      TENTATIVAS: "5"                     # tentativas por link antes de marcar erro
      TZ: America/Sao_Paulo
    volumes:
      - ./data:/data
