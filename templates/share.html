<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ job.nome }}</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--borda:#2a2f3a;--txt:#e6e8ec;--sub:#9aa3b2;--azul:#4c8dff}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
main{max-width:820px;margin:0 auto;padding:32px 16px 60px}
h1{font-size:22px;margin:0 0 4px;word-break:break-word}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border:1px solid var(--borda);border-radius:10px;margin-top:18px;overflow:hidden}
.arq{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--borda)}
.arq:first-child{border-top:0}
.arq .n{word-break:break-all;font-size:14px}
a.bt{background:var(--azul);color:#fff;text-decoration:none;border-radius:8px;padding:8px 14px;white-space:nowrap;font-size:14px}
a.bt.grande{display:inline-block;margin-top:18px;padding:11px 20px;font-size:15px}
</style>
</head>
<body>
<main>
  <h1>{{ job.nome }}</h1>
  <div class="sub">{{ itens|length }} arquivo(s) · {{ job.tamanho_final|tamanho }} · disponível até {{ job.expira|datahora }}</div>

  {% if itens|length > 1 %}
  <a class="bt grande" href="{{ token }}/tudo.zip">Baixar tudo (.zip)</a>
  {% endif %}

  <div class="card">
    {% for it in itens %}
    <div class="arq">
      <div><div class="n">{{ it.rel }}</div><div class="sub">{{ it.tamanho|tamanho }}</div></div>
      <a class="bt" href="{{ token }}/arquivo/{{ it.url }}">Baixar</a>
    </div>
    {% else %}
    <div class="arq"><span class="sub">Nenhum arquivo.</span></div>
    {% endfor %}
  </div>
</main>
</body>
</html>
